name: sinaliza
description: "Aplicativo de reconhecimento de vogais em LIBRAS."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  camera: ^0.11.0+2
  http: ^1.2.2
  permission_handler: ^11.3.1
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - public/images/sinaliza-logo.png
    - public/images/sinaliza-logo-white.png 
    - public/icons/lucide/